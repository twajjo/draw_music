# Render Blueprint: the app from the Dockerfile plus a managed Postgres.
# See DEPLOY.md. SECRET_KEY_BASE is set by hand in the dashboard: Render's
# generated values are too short for Phoenix (it needs 64 bytes).
services:
  - type: web
    name: draw-music
    runtime: docker
    plan: starter
    healthCheckPath: /health
    preDeployCommand: /app/bin/migrate
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: draw-music-db
          property: connectionString
      - key: SECRET_KEY_BASE
        sync: false
      - key: PHX_HOST
        value: draw-music.onrender.com
      - key: PORT
        value: "4000"
    # For instruments fetched after deploy (a paid disk):
    # disk:
    #   name: samples
    #   mountPath: /data/samples
    #   sizeGB: 1
    # and an envVar SAMPLES_DIR=/data/samples

databases:
  - name: draw-music-db
    plan: basic-256mb
    databaseName: draw_music
    user: draw_music
